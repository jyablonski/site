repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ["--maxkb=500"]

  - repo: local
    hooks:
      - id: prettier
        name: prettier
        entry: npx prettier --write
        language: system
        types_or: [javascript, jsx, ts, tsx, json, css, markdown, astro]
      - id: eslint
        name: eslint
        entry: npx eslint . --max-warnings 0
        language: system
        pass_filenames: false
      - id: astro-check
        name: astro check
        entry: npm run check
        language: system
        pass_filenames: false
